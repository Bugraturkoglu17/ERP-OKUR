<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#09111b" />
    <title>Bağlantı Yok · SİSMİK</title>
    <style>
      *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,440px);padding:36px 30px 32px;border:1px solid #e2e8f0;border-radius:24px;background:#fff;box-shadow:0 24px 70px rgba(15,23,42,.08);text-align:center}.mark{width:74px;height:74px;margin:0 auto 24px;color:#ff3131}.eyebrow{margin:0 0 10px;color:#64748b;font-size:11px;font-weight:700;letter-spacing:.2em}.title{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.04em}.copy{max-width:320px;margin:14px auto 26px;color:#64748b;font-size:15px;line-height:1.65}.retry{min-height:46px;padding:0 22px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:transform .16s ease,background .16s ease}.retry:hover{background:#1e293b}.retry:active{transform:scale(.98)}.retry:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <svg class="mark" viewBox="0 0 1500 1500" role="img" aria-label="SİSMİK amblemi"><path fill="currentColor" d="M1284.949 187.699v1124.594L911.484 985.531c-57.015-49.863-57.015-138.554 0-188.418l231.649 202.723v-499.68L215.039 1312.293V187.699l481.129 420.996-25.246 22.082c-47.219 41.312-117.665 41.312-164.883 0L356.859 500.156v499.629z"/></svg>
      <p class="eyebrow">SİSMİK · KURUMSAL OPERASYON SİSTEMİ</p>
      <h1 class="title">Bağlantı Yok</h1>
      <p class="copy">İnternet bağlantınızı kontrol ederek tekrar deneyin.</p>
      <button class="retry" type="button" onclick="location.reload()">Tekrar Dene</button>
    </main>
  </body>
</html>
