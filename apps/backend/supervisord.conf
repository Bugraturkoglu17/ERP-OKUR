[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:redis]
command=/usr/bin/redis-server --bind 0.0.0.0 --port 6379 --save "" --appendonly no
autostart=true
autorestart=true
priority=10
user=app
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
priority=20
user=app
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=REDIS_URL="redis://127.0.0.1:6379/0",HOME="/home/app",USER="app"

[program:worker]
command=celery -A app.core.workers.tasks worker --loglevel=info
autostart=true
autorestart=true
priority=30
user=app
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=REDIS_URL="redis://127.0.0.1:6379/0",HOME="/home/app",USER="app"
